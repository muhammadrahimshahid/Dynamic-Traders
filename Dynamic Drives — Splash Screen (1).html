<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynamic Drives</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;700;900&family=Barlow:wght@300;400&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --navy:  #0c0e12;
    --blue:  #1f6fdb;
    --blue2: #3b8ef5;
    --ice:   #a8ccff;
    --white: #ffffff;
  }

  html, body { width:100%; height:100%; background:var(--navy); overflow:hidden; }

  #splash {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    overflow:hidden;
  }

  /* ── GRID ── */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(31,111,219,0.07) 1px, transparent 1px),
      linear-gradient(90deg,rgba(31,111,219,0.07) 1px, transparent 1px);
    background-size:60px 60px;
    opacity:0; animation:gridFade 1.2s ease forwards;
  }
  @keyframes gridFade { to { opacity:1; } }

  /* ── RADIAL GLOW ── */
  .glow-ring {
    position:absolute; width:660px; height:660px; border-radius:50%;
    background:radial-gradient(circle, rgba(31,111,219,0.22) 0%, transparent 68%);
    animation:glowPulse 3.5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { transform:scale(1);    opacity:.8; }
    50%      { transform:scale(1.12); opacity:1;  }
  }

  /* ── SPEED STREAKS ── */
  .streaks { position:absolute; inset:0; pointer-events:none; }
  .streak {
    position:absolute; left:-120%; height:1px;
    background:linear-gradient(90deg, transparent, var(--blue), transparent);
    animation:shoot var(--dur) ease-out var(--delay) both;
  }
  @keyframes shoot {
    from { left:-120%; opacity:0; }
    10%  { opacity:1; }
    to   { left:120%; opacity:0; }
  }

  /* ── LOGO WRAPPER ── */
  #logo-wrap {
    position:relative; width:230px; height:230px; flex-shrink:0;
    animation:logoReveal .9s cubic-bezier(.22,1,.36,1) .3s both;
    /* unified glow for whole logo */
    filter: drop-shadow(0 0 18px rgba(31,111,219,0.85))
            drop-shadow(0 0 50px rgba(31,111,219,0.4));
  }
  @keyframes logoReveal {
    from { opacity:0; transform:scale(.5) rotate(-20deg); }
    to   { opacity:1; transform:scale(1)  rotate(0deg);   }
  }

  /* gear — spins */
  #gear-img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    animation:gearSpin 8s linear 1.2s infinite;
    transform-origin:center center;
  }
  @keyframes gearSpin { to { transform:rotate(360deg); } }

  /* inner DD + blue ring — completely static */
  #inner-img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
  }

  /* ── ORBIT RINGS ── */
  .orbit-ring {
    position:absolute; inset:-22px; border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--blue2);
    border-right-color:rgba(59,142,245,.2);
    animation:orbitA 3s linear 1.1s infinite;
    opacity:0; animation-fill-mode:forwards;
  }
  @keyframes orbitA {
    0%  { opacity:0; transform:rotate(0deg); }
    4%  { opacity:1; }
    100%{ opacity:1; transform:rotate(360deg); }
  }
  .orbit-ring-2 {
    position:absolute; inset:-12px; border-radius:50%;
    border:1px solid transparent;
    border-bottom-color:rgba(31,111,219,.5);
    border-left-color:rgba(31,111,219,.2);
    animation:orbitB 5.5s linear 1.3s infinite;
    opacity:0; animation-fill-mode:forwards;
  }
  @keyframes orbitB {
    0%  { opacity:0; transform:rotate(0deg); }
    4%  { opacity:1; }
    100%{ opacity:1; transform:rotate(-360deg); }
  }

  /* cardinal glow dots */
  .dot {
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:var(--blue2);
    box-shadow:0 0 10px var(--blue2), 0 0 20px var(--blue);
    opacity:0; animation:dotPop .3s ease 1.65s forwards;
  }
  @keyframes dotPop { to { opacity:1; } }
  .dot-t { top:-30px;    left:50%; transform:translateX(-50%); }
  .dot-b { bottom:-30px; left:50%; transform:translateX(-50%); }
  .dot-l { left:-30px;   top:50%;  transform:translateY(-50%); }
  .dot-r { right:-30px;  top:50%;  transform:translateY(-50%); }

  /* ── BRAND ── */
  .brand { margin-top:38px; text-align:center; position:relative; z-index:2; }

  .brand-name {
    font-family:'Barlow Condensed',sans-serif; font-weight:900;
    font-size:clamp(50px,9vw,94px); letter-spacing:.14em; line-height:.95;
    display:flex; gap:.18em; justify-content:center; overflow:hidden;
  }
  .word { display:inline-block; opacity:0; transform:translateY(64px); }
  .word:nth-child(1){ animation:wordRise .7s cubic-bezier(.22,1,.36,1) 1.15s forwards; }
  .word:nth-child(2){ animation:wordRise .7s cubic-bezier(.22,1,.36,1) 1.35s forwards; }
  @keyframes wordRise { to { opacity:1; transform:translateY(0); } }
  .word-dynamic { color:var(--white); }
  .word-drives  { color:var(--blue2); }

  .accent-line {
    height:3px; margin-top:14px;
    background:linear-gradient(90deg, transparent, var(--blue), var(--blue2), transparent);
    transform:scaleX(0); animation:lineExpand .6s cubic-bezier(.4,0,.2,1) 1.9s forwards;
  }
  @keyframes lineExpand { to { transform:scaleX(1); } }

  .tagline {
    margin-top:13px; font-family:'Barlow',sans-serif; font-weight:300;
    font-size:clamp(10px,1.5vw,14px); letter-spacing:.38em; text-transform:uppercase;
    color:var(--ice); opacity:0; animation:fadeUp .8s ease 2.1s forwards;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:.65; transform:translateY(0); }
  }

  /* ── CORNER BRACKETS ── */
  .bracket { position:absolute; width:44px; height:44px; opacity:0; animation:bktIn .5s ease 2.0s forwards; }
  .bracket::before,.bracket::after { content:''; position:absolute; background:var(--blue); }
  .bracket::before { width:2px; height:100%; }
  .bracket::after  { width:100%; height:2px; }
  .bracket-tl{ top:18px; left:18px; }
  .bracket-tl::before,.bracket-tl::after { top:0; left:0; }
  .bracket-tr{ top:18px; right:18px; transform:scaleX(-1); }
  .bracket-tr::before,.bracket-tr::after { top:0; left:0; }
  .bracket-bl{ bottom:18px; left:18px; transform:scaleY(-1); }
  .bracket-bl::before,.bracket-bl::after { top:0; left:0; }
  .bracket-br{ bottom:18px; right:18px; transform:scale(-1); }
  .bracket-br::before,.bracket-br::after { top:0; left:0; }
  @keyframes bktIn { to { opacity:1; } }

  /* ── LOAD BAR ── */
  .load-wrap {
    position:absolute; bottom:42px; width:clamp(220px,30vw,360px);
    opacity:0; animation:fadeUp .5s ease 2.2s forwards;
  }
  .load-track { height:2px; background:rgba(31,111,219,.2); border-radius:2px; overflow:hidden; }
  .load-bar {
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--blue), var(--blue2));
    border-radius:2px; position:relative;
    animation:loadFill 2.4s cubic-bezier(.4,0,.2,1) 2.4s forwards;
  }
  .load-bar::after {
    content:''; position:absolute; right:0; top:-3px;
    width:6px; height:8px; background:var(--white); border-radius:1px;
    box-shadow:0 0 8px var(--blue2);
  }
  @keyframes loadFill { to { width:100%; } }
  .load-label {
    display:flex; justify-content:space-between; margin-top:8px;
    font-family:'Barlow',sans-serif; font-size:10px;
    letter-spacing:.22em; color:rgba(168,204,255,.5);
  }

  /* ── PARTICLES ── */
  .particle {
    position:absolute; width:var(--sz); height:var(--sz);
    border-radius:50%; background:var(--blue); opacity:0;
    animation:float var(--fdur) ease-in-out var(--fdelay) infinite alternate;
  }
  @keyframes float {
    0%  { opacity:0; transform:translate(0,0) scale(.5); }
    30% { opacity:.5; }
    100%{ opacity:.07; transform:translate(var(--fx),var(--fy)) scale(1); }
  }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; }
  }
</style>
</head>

  <div class="grid"></div>
  <div class="glow-ring"></div>
  <div class="streaks" id="streaks"></div>

  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <div id="logo-wrap">
    <div class="orbit-ring"></div>
    <div class="orbit-ring-2"></div>

  function tick(now) {
    const t = Math.min(Math.max(0, now - startTime) / duration, 1);
    const e = t < .5 ? 2*t*t : -1+(4-2*t)*t;
    pctEl.textContent = Math.round(e*100)+'%';
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
